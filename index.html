<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mason Audio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<title>Charlotte Mason audio</title>
</head>
<body>
<header class="top">
  <h1>Charlotte Mason</h1>
</header>
<main id="main">
  <section id="cont" class="cont" hidden>
    <div class="cont-label">Continue</div>
    <button id="contBtn" class="cont-btn" type="button">
      <span id="contTitle" class="cont-title"></span>
      <span id="contMeta" class="cont-meta"></span>
    </button>
  </section>
  <section id="marks" class="marks" hidden>
    <h2>Bookmarks</h2>
    <ul id="markList" class="mk-list"></ul>
  </section>
  <div id="books" class="books"></div>
  <p id="msg" class="msg" role="status"></p>
</main>
<footer id="player" class="player" hidden>
  <div class="now">
    <div id="nowTitle" class="now-title"></div>
    <div id="nowBook" class="now-book"></div>
  </div>
  <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position in chapter">
  <div class="times"><span id="tCur">0:00</span><span id="tLeft">-0:00</span></div>
  <div class="ctrls">
    <button id="back" class="skip" type="button" aria-label="Back 15 seconds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="6.5" font-weight="700">15</text></svg>
    </button>
    <button id="play" class="play" type="button" aria-label="Play">
      <svg id="icPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icPause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      <span id="playLabel" class="play-label">Paused</span>
    </button>
    <button id="fwd" class="skip" type="button" aria-label="Forward 30 seconds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="6.5" font-weight="700">30</text></svg>
    </button>
    <button id="next" class="nextch" type="button" aria-label="Next chapter">Next</button>
  </div>
  <div class="ctrls2">
    <div class="rates" role="group" aria-label="Playback speed">
      <button type="button" data-rate="0.25">0.25x</button>
      <button type="button" data-rate="0.5">0.5x</button>
      <button type="button" data-rate="1">1x</button>
      <button type="button" data-rate="1.5">1.5x</button>
      <button type="button" data-rate="2">2x</button>
    </div>
    <button id="mark" class="mark" type="button" aria-label="Bookmark this place">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Bookmark
    </button>
  </div>
</footer>
<audio id="audio" preload="metadata" playsinline></audio>
<script src="app.js" defer></script>
</body>
</html>
